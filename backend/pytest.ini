[pytest]
testpaths = tests

# Without this, pytest puts tests/ on sys.path but not the project root, and
# `from app...` fails with ModuleNotFoundError.
pythonpath = .

# Every test here is async. Without this, pytest-asyncio would need an
# @pytest.mark.asyncio decorator on all of them, and a forgotten one silently
# passes without running anything.
asyncio_mode = auto

# One event loop for the whole session, so the engine created in a
# session-scoped fixture is usable from every test.
#
# Both settings are required. Setting only the fixture scope leaves each test
# running in its own loop, and asyncpg connections opened by the session-scoped
# engine then fail with "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

addopts = -q --strict-markers
